substitutions:
  turn_on_hour: "18"
  turn_on_min: "30"
  turn_off_hour: "6"
  turn_off_min: "0"

esphome:
  name: "streetlight"
  friendly_name: Single Relay ESP8266
  on_boot:
    priority: -10
    then:
      # Start the 90-second LED timer as soon as it gets power
      - script.execute: led_status_timer
      - wait_until:
          lambda: 'return id(sntp_time).now().is_valid();'
      - if:
          condition:
            lambda: |-
              auto time = id(sntp_time).now();
              int current_mins = time.hour * 60 + time.minute;
              int on_mins = ${turn_on_hour} * 60 + ${turn_on_min};
              int off_mins = ${turn_off_hour} * 60 + ${turn_off_min};
              
              if (on_mins >= off_mins) {
                return (current_mins >= on_mins || current_mins < off_mins);
              } else {
                return (current_mins >= on_mins && current_mins < off_mins);
              }
          then:
            - switch.turn_on: relay_1
          else:
            - switch.turn_off: relay_1

esp8266:
  board: d1_mini

time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Kolkata"
    on_time:
      - seconds: 0
        minutes: ${turn_on_min}
        hours: ${turn_on_hour}
        then:
          - switch.turn_on: relay_1
      - seconds: 0
        minutes: ${turn_off_min}
        hours: ${turn_off_hour}
        then:
          - switch.turn_off: relay_1

button:
  - platform: restart
    name: "Restart Device"
    id: restart_device

# --- The 90-Second Stealth Timer ---
script:
  - id: led_status_timer
    mode: restart # If an event happens while running, the 90s restarts
    then:
      - delay: 90s
      - light.turn_off: wemos_led

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

logger:
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  reboot_timeout: 0s
  ap:
    ssid: "HDz_Relay"
    password: !secret ap_password
    ap_timeout: 1min 
  # CORRECTED INDENTATION BELOW
  on_connect:
    - script.execute: led_status_timer
    - if:
        condition:
          switch.is_on: relay_1
        then:
          - light.turn_on: wemos_led
        else:
          - light.turn_off: wemos_led
  on_disconnect:
    - script.execute: led_status_timer

captive_portal:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 15min

  - platform: uptime
    id: uptime_raw
    internal: true
    update_interval: 15min

  - platform: adc
    pin: VCC
    name: "Supply Voltage"
    update_interval: 15min

text_sensor:
  - platform: template
    name: "Uptime"
    icon: "mdi:clock-outline"
    update_interval: 15min
    lambda: |-
      int sec = id(uptime_raw).state;
      int days = sec / 86400;
      int hours = (sec % 86400) / 3600;
      int mins = (sec % 3600) / 60;
      char buffer[32];
      sprintf(buffer, "%dd %dh %dm", days, hours, mins);
      return std::string(buffer);

light:
  - platform: binary
    id: wemos_led
    output: led_output

output:
  - platform: gpio
    id: led_output
    pin:
      number: GPIO2 
      inverted: true

interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - not:
                  wifi.connected:
              # ONLY blink if the 90-second timer is currently running
              - script.is_running: led_status_timer
          then:
            - light.toggle: wemos_led

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12 
      mode: INPUT_PULLUP
      inverted: true
    name: "Manual Button"
    on_press:
      - switch.toggle: relay_1

switch:
  - platform: gpio
    pin: 
      number: GPIO4 
    name: "Relay"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      # Wake up LED for 90s to show it turned ON
      - script.execute: led_status_timer
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on: wemos_led
    on_turn_off:
      # Wake up timer (so if Wi-Fi is disconnected, it blinks for 90s)
      - script.execute: led_status_timer
      - light.turn_off: wemos_led
