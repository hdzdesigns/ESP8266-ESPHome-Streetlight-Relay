# -----------------------------------------------------------------------------------
# PROJECT: ESP8266 ESPHome Streetlight Relay
# HARDWARE: ESP8266 (Wemos D1 Mini), DS1307 RTC, Single Channel Relay
# FEATURES: 12h-Format UI, Flash-Persistent Schedule, Manual Override, Status Stealth LED
# -----------------------------------------------------------------------------------

esphome:
  name: "streetlight"
  friendly_name: Streetlight Relay
  on_boot:
    priority: -10
    then:

      - script.execute: led_status_timer
      - wait_until:
          lambda: 'return id(rtc_time).now().is_valid();'
      - component.update: schedule_readout
      - component.update: uptime_raw
      - component.update: uptime_display
      - if:
          condition:
            lambda: |-
              auto time = id(rtc_time).now();
              
              ESP_LOGI("rtc_logic", "Boot sync: Read time %02d:%02d from hardware RTC.", time.hour, time.minute);
              
              int current_mins = time.hour * 60 + time.minute;
              
              int on_mins = id(turn_on_time).hour * 60 + id(turn_on_time).minute;
              int off_mins = id(turn_off_time).hour * 60 + id(turn_off_time).minute;
              
              if (on_mins >= off_mins) {
                return (current_mins >= on_mins || current_mins < off_mins);
              } else {
                return (current_mins >= on_mins && current_mins < off_mins);
              }
          then:
            - switch.turn_on: relay_1
          else:
            - switch.turn_off: relay_1

esp8266:
  board: d1_mini

# --- HARDWARE I2C BUS ---
i2c:
  sda: GPIO14 # D5
  scl: GPIO5  # D1
  scan: true

# --- DYNAMIC SCHEDULE ENTITIES ---
datetime:
  - platform: template
    type: time
    name: "Turn On Time"
    id: turn_on_time
    optimistic: yes
    restore_value: true
    initial_value: "18:30:00"
    on_value:
      then:
        - component.update: schedule_readout

  - platform: template
    type: time
    name: "Turn Off Time"
    id: turn_off_time
    optimistic: yes
    restore_value: true
    initial_value: "06:00:00"
    on_value:
      then:
        - component.update: schedule_readout

time:
  # INTERNET CLOCK
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Kolkata"
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time

  # HARDWARE MASTER CLOCK
  - platform: ds1307
    id: rtc_time
    timezone: "Asia/Kolkata"
    update_interval: 15min
    on_time:
      - seconds: 0
        minutes: '*'
        hours: '*'
        then:
          - lambda: |-
              auto current = id(rtc_time).now();
              
              ESP_LOGD("rtc_logic", "Schedule check: Read time %02d:%02d from hardware RTC.", current.hour, current.minute);

              if (current.hour == id(turn_on_time).hour && current.minute == id(turn_on_time).minute) {
                id(relay_1).turn_on();
              } 
              else if (current.hour == id(turn_off_time).hour && current.minute == id(turn_off_time).minute) {
                id(relay_1).turn_off();
              }

button:
  - platform: restart
    name: "Restart Device"
    id: restart_device

# --- 90sec Led Timer ---
script:
  - id: led_status_timer
    mode: restart
    then:
      - delay: 90s
      - light.turn_off: wemos_led

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

logger:
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  reboot_timeout: 0s
  ap:
    ssid: "HDz_Relay"
    password: !secret ap_password
    ap_timeout: 1min 
  on_connect:
    - script.execute: led_status_timer
    - if:
        condition:
          switch.is_on: relay_1
        then:
          - light.turn_on: wemos_led
        else:
          - light.turn_off: wemos_led
  on_disconnect:
    - script.execute: led_status_timer

captive_portal:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 15min

  - platform: uptime
    id: uptime_raw
    internal: true
    update_interval: 15min

  - platform: adc
    pin: VCC
    name: "Supply Voltage"
    update_interval: 15min

text_sensor:
  - platform: template
    name: "Uptime"
    id: uptime_display
    icon: "mdi:clock-outline"
    update_interval: 15min
    lambda: |-
      uint32_t sec = (uint32_t)id(uptime_raw).state;
      
      int days = sec / 86400;
      int hours = (sec % 86400) / 3600;
      int mins = (sec % 3600) / 60;
      
      char buffer[32];
      sprintf(buffer, "%dd %dh %dm", days, hours, mins);
      return std::string(buffer);

  - platform: template
    name: "Active Schedule"
    id: schedule_readout
    icon: "mdi:calendar-clock"
    update_interval: never
    lambda: |-
      char buffer[64];
      
      int on_h = id(turn_on_time).hour;
      int on_m = id(turn_on_time).minute;
      int off_h = id(turn_off_time).hour;
      int off_m = id(turn_off_time).minute;
      
      int on_h12 = (on_h % 12 == 0) ? 12 : (on_h % 12);
      const char* on_ampm = (on_h >= 12) ? "PM" : "AM";
      
      int off_h12 = (off_h % 12 == 0) ? 12 : (off_h % 12);
      const char* off_ampm = (off_h >= 12) ? "PM" : "AM";

      sprintf(buffer, "ON: %02d:%02d %s | OFF: %02d:%02d %s", 
              on_h12, on_m, on_ampm, 
              off_h12, off_m, off_ampm);
              
      return std::string(buffer);

light:
  - platform: binary
    id: wemos_led
    output: led_output

output:
  - platform: gpio
    id: led_output
    pin:
      number: GPIO2 
      inverted: true

interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - not:
                  wifi.connected:
              - script.is_running: led_status_timer
          then:
            - light.toggle: wemos_led

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12 
      mode: INPUT_PULLUP
      inverted: true
    name: "Manual Button"
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay_1

switch:
  - platform: gpio
    pin: 
      number: GPIO4 
    name: "Relay"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: led_status_timer
      - component.update: uptime_raw
      - component.update: uptime_display
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on: wemos_led
    on_turn_off:
      - script.execute: led_status_timer
      - component.update: uptime_raw
      - component.update: uptime_display
      - light.turn_off: wemos_led